<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>展示見学の時間割</title><style>body{font:18px system-ui;max-width:38rem;margin:2rem auto;padding:1rem;color:#24412b;background:#f4faf2}label,output{display:block;margin:1rem 0}input,button{font:inherit;padding:.5rem;max-width:100%}</style><h1>展示見学の時間割</h1><p>下書きです。開催情報・料金は公式情報と照合してください。</p><label>開始<input id="start" type="time" value="10:00"></label><label>1展示の分数<input id="minutes" type="number" min="5" max="180" value="30"></label><label>展示数<input id="count" type="number" min="1" max="12" value="4"></label><button id="go">予定を作る</button><output id="out"></output><script>const itinerary=function itinerary(start, minutes, count) {
  const [hour, minute] = String(start).split(':').map(Number);
  if (
    !Number.isInteger(hour) ||
    hour < 0 ||
    hour > 23 ||
    !Number.isInteger(minute) ||
    minute < 0 ||
    minute > 59 ||
    !Number.isInteger(count) ||
    count < 1 ||
    count > 12 ||
    !Number.isFinite(minutes) ||
    minutes < 5 ||
    minutes > 180
  )
    throw new Error('Invalid itinerary');
  return Array.from({ length: count }, (_, i) => {
    const total = (hour * 60 + minute + minutes * i) % 1440;
    return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(Math.floor(total % 60)).padStart(2, '0')}`;
  });
};document.getElementById("go").onclick=()=>{try{document.getElementById("out").textContent=itinerary(document.getElementById("start").value,Number(document.getElementById("minutes").value),Number(document.getElementById("count").value)).join(" / ")}catch{document.getElementById("out").textContent="入力範囲を確認してください"}};</script></html>
