<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>園芸博準備チェック</title><style>body{font:18px system-ui;max-width:38rem;margin:2rem auto;padding:1rem;color:#24412b;background:#f4faf2}label,output{display:block;margin:1rem 0}input,button{font:inherit;padding:.5rem;max-width:100%}</style><h1>園芸博準備チェック</h1><p>下書きです。開催情報・料金は公式情報と照合してください。</p><label><input type="checkbox">開催日と入場券</label><label><input type="checkbox">行き帰りの交通手段</label><label><input type="checkbox">天候・飲み物・休憩</label><label><input type="checkbox">見たい展示</label><button id="reset">チェックを消す</button><script>document.getElementById("reset").onclick=()=>document.querySelectorAll("input").forEach(x=>x.checked=false);</script></html>
